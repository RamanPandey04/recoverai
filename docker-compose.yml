services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recoverai
      POSTGRES_PASSWORD: recoverai
      POSTGRES_DB: recoverai
    ports:
      - "5432:5432"
    volumes:
      - recoverai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoverai"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  recoverai_postgres:
